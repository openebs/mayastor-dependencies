syntax = "proto3";

package mayastor.v1;
// Protocol over which the bdev/replica/nexus etc will be shared.
enum ShareProtocol {
  NONE = 0; // not exposed
  NVMF = 1; // NVMe over Fabrics (TCP)
  ISCSI = 2; // iSCSI
}

message MayastorFeatures {
  // NVMe ANA enablement status.
  bool asymmetricNamespaceAccess = 1;
  // LVM backend presence and enablement status.
  optional bool logicalVolumeManager = 2;
  // SnapshotRebuild presence and enablement status.
  optional bool snapshotRebuild = 3;
  // RDMA support of the io-engine itself, which says nothing about rdma being
  // usable on this node, see NvmfTargetInfo for that.
  optional bool rdmaCapableIoEngine = 4;
  // Diskpool encryption capability.
  optional bool diskpoolEncryption = 5;
  // Support for nexus label version via create_nexus2.
  // This returns the latest version supported.
  uint32 nexus_label_version = 6;
  // The io-engine gRPC server has TLS enabled and expects TLS connections.
  optional bool grpcTls = 7;
  // The io-engine runs in FIPS mode: its crypto modules are FIPS validated.
  optional bool fips = 8;
}

// The transport capabilities of the node an io-engine runs on. Computed the
// same way as the csi node does, so both report the same thing.
message TransportCaps {
  // RDMA HCA hardware is present on this node, which is the same thing
  // ibv_devinfo reports, only asked straight to libibverbs.
  bool rdmaHcaPresent = 1;
  // The nvme_rdma kernel module is loaded on this node. Both this and
  // rdmaHcaPresent are required for NVMe-oF RDMA to actually be usable.
  // Note that the io-engine itself does not use it, as it does rdma from
  // userspace, it only reports it for the node.
  bool nvmeRdmaModuleLoaded = 2;
}

// The state of an io-engine's nvmf target.
message NvmfTargetInfo {
  // The network interface the target listens on, as specified through
  // --nvmf-tgt-interface, unset if it wasn't.
  optional string interface = 1;
  // The address the target listens on, on the usual nexus and replica ports.
  string address = 2;
  // Whether the target is listening over tcp. Set means it was asked for,
  // the value says whether it panned out.
  optional bool tcp = 3;
  // Whether the target is listening over rdma, which is what makes rdma
  // usable. Unset means rdma wasn't asked for, false means it was but spdk
  // couldn't do it: no rdma support built in, no usable rdma devices, or the
  // listeners failed to bind.
  optional bool rdma = 4;
}

message MayastorBugFixes {
  // Nexus rebuilds both the clusters allocated to the replica and its ancestors clusters
  bool nexusRebuildReplicaAncestry = 1;
}

// Cipher to use for encryption.
enum Cipher {
  AES_CBC = 0;
  AES_XTS = 1;
}

// Represents an encryption key that can be used to encrypt an
// entity like pool or lvol/replica.
message EncryptionKey {
  // Name of the key.
  string key_name = 1;
  // The AES encryption key.
  bytes key = 2;
  // AES Key length.
  uint32 key_length = 3;
  // key2 (required for AES_XTS).
  optional bytes key2 = 4;
  // The length of key2. Must be same as key_length.
  optional uint32 key2_length = 5;
}

message EncryptionData {
  // Cipher to be used.
  Cipher cipher = 1;
  // The encryption key.
  EncryptionKey key = 2;
}

// This message represents name of the source for getting
// key parameter details.
message EncryptionSecret {
  string secret = 1;
}
