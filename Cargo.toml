[patch.crates-io]
h2 = { path = "./h2" }

[profile.dev]
panic = "abort"
debug = false

[workspace]
members = [
    "apis/events",
    "apis/io-engine",
    "composer",
    "devinfo",
    "event-publisher",
    "git-version-macro",
    "nvmeadm",
    "platform",
    "nvmeadm",
    "secret-provider",
    "sysfs",
    "tracing-filter",
    "version-info",
]
resolver = "1"

[workspace.dependencies]
prost-extend = { path = "./prost-extend" }

tokio = { version = "1.45.1", default-features = false }
futures = "0.3.31"

tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

once_cell = "1.20.2"
async-trait = "0.1.73"

serde = "1.0.214"
serde_json = "1.0.132"

snafu = "0.8.5"
url = "2.5.4"
uuid = { version = "1.4.1", features = ["v4"] }
chrono = "0.4.38"
glob = "0.3.1"

strum = "0.26.3"
strum_macros = "0.26.4"
heck = "0.5.0"

tonic = "0.12.3"
tonic-build = "0.12.3"
prost-types = "0.13.3"
prost = "0.13.2"
prost-derive = "0.13.3"
bytes = "1.8.0"
prost-build = "0.13.3"
pbjson = "0.7.0"
pbjson-build = "0.7.0"

udev = "0.9.1"
bindgen = "0.69.5"
nix = { version = "0.29.0", default-features = false }
ipnetwork = "0.20.0"
bollard = "0.17.1"
semver = "1.0.23"

async-nats = { version = "0.37.0", default-features = false }

k8s-openapi = { version = "0.22.0", default-features = false, features = ["v1_24", "schemars"] }
kube = { version = "0.94.2", default-features = false, features = ["runtime", "derive", "client"] }
