[patch.crates-io]
h2 = { path = "./h2" }

[profile.dev]
panic = "abort"
debug = false

[workspace]
members = [
    "apis/events",
    "apis/io-engine",
    "cert-watcher",
    "composer",
    "devinfo",
    "event-publisher",
    "fips",
    "git-version-macro",
    "grpc-tls",
    "nvmeadm",
    "platform",
    "nvmeadm",
    "secret-provider",
    "sysfs",
    "tracing-filter",
    "version-info",
]
resolver = "1"

[workspace.dependencies]
prost-extend = { path = "./prost-extend" }

tokio = { version = "1.45.1", default-features = false }
futures = "0.3.31"

tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

# certificate file watching for TLS auto-reload (cert-watcher); Linux/inotify only
inotify = { version = "0.11.0", default-features = false }

once_cell = "1.20.2"
async-trait = "0.1.73"

serde = "1.0.214"
serde_json = "1.0.132"

snafu = "0.8.5"
thiserror = "2.0.20"
url = "2.5.4"
uuid = { version = "1.4.1", features = ["v4"] }
chrono = "0.4.38"
glob = "0.3.1"
regex = "1.11.1"

strum = "0.26.3"
strum_macros = "0.26.4"
heck = "0.5.0"

tonic = "0.13.1"
tonic-build = "0.13.1"
prost-types = "0.13.3"
prost = "0.13.2"
prost-derive = "0.13.3"
bytes = "1.8.0"
prost-build = "0.13.3"
pbjson = "0.7.0"
pbjson-build = "0.7.0"

udev = "0.9.1"
bindgen = "0.69.5"
nix = { version = "0.29.0", default-features = false }
ipnetwork = "0.20.0"
bollard = "0.17.1"
semver = "1.0.23"

async-nats = { version = "0.47.0", default-features = false, features = ["jetstream"] }

k8s-openapi = { version = "0.24.0", default-features = false, features = ["v1_28", "schemars"] }
kube = { version = "0.99.0", default-features = false, features = ["runtime", "derive", "client"] }

aws-lc-rs = { version = "1.18", default-features = false, features = ["alloc", "ring-io", "ring-sig-verify"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }

# grpc-tls transport
tokio-stream = { version = "0.1", features = ["net"] }
http = "1.1.0"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
rustls-pemfile = "2.2.0"
rustls-native-certs = "0.8.3"
hyper-util = "0.1.10"
tower = { version = "0.5", features = ["util"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
