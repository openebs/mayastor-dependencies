name: Setup Nix

description: GC Disk, install nix

inputs:
  pre-fetch-nix:
    description: Pre-run nix-shell for downloading the dependencies
    required: false
    default: ""
  gc:
    description: Clear up storage from worker
    required: false
    default: false
  github-access-token:
    description: GitHub access token for installing Nix
    required: false
    default: ""
  hide-cachix-token:
    description: Hide github access token from logs
    required: false
    default: false
  rust-cache:
    description: Enable Rust dependencies caching
    required: false
    default: false
  nix-sources:
    description: Path to the niv sources.json, used to set the nixpkgs NIX_PATH
    required: false
    default: nix/sources.json

runs:
  using: composite
  steps:
    - name: Linux Runner Info
      shell: bash
      if: ${{ runner.os == 'Linux' }}
      run: |
        lscpu
        free -h
        lsblk -fm
        lsb_release -a
        uname -a
    - name: Disk Garbage Collection
      shell: bash
      if: ${{ runner.os == 'Linux' && inputs.gc == 'true' }}
      run: |
        lsblk -fm
        echo "::group::Step: GC Disk"
        start=$(date +%s)
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/local/.ghcup
        sudo rm -rf /opt/hostedtoolcache
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/share/swift
        end=$(date +%s)
        echo "::endgroup::"
        echo "⏱️ GC took $(( end - start ))s"
        lsblk -fm
    - id: nixpkgs
      shell: bash
      env:
        NIX_SOURCES: ${{ inputs.nix-sources }}
      run: |
        echo "nix_path=nixpkgs=$(jq -r '.nixpkgs.url' "$NIX_SOURCES")" >> $GITHUB_OUTPUT
        echo "user=${USER:-$(whoami)}" >> $GITHUB_OUTPUT
    - uses: cachix/install-nix-action@v31.11.1
      with:
        nix_path: "${{ steps.nixpkgs.outputs.nix_path }}"
        install_options: ${{ runner.os == 'Linux' && '--no-daemon' || '' }}
        extra_nix_config: |
          keep-env-derivations = true
          keep-outputs = true
          trusted-users = root ${{ steps.nixpkgs.outputs.user }}
        github_access_token: ${{ inputs.hide-cachix-token != 'true' && inputs.github-access-token || '' }}
      env:
        NIX_PATH: "${{ steps.nixpkgs.outputs.nix_path }}"
    - name: PreFetch Nix
      if: ${{ inputs.pre-fetch-nix }}
      shell: bash
      run: |
        IFS=',' read -ra arr <<< "${{ inputs.pre-fetch-nix }}"
        for nix in "${arr[@]}"; do
          echo "::group::Step: nix-build $nix"
          start=$(date +%s)

          nix-build "$nix"

          end=$(date +%s)
          echo "::endgroup::"

          echo "⏱️ $nix took $(( end - start ))s"
        done

    - name: Rustc for Rust dependencies caching
      if: ${{ inputs.rust-cache == 'true' }}
      shell: bash
      run: |
        nix-shell --pure --run 'dirname "$(command -v rustc)" > rustc' shell.nix
        echo "PATH=$(cat rustc):$PATH" >> $GITHUB_ENV

    - name: Handle Rust dependencies caching
      if: ${{ inputs.rust-cache == 'true' }}
      uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ startsWith(github.ref_name, 'release/') || github.ref_name == 'develop' }}
